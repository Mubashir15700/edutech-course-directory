version: '3.8'

services:
  backend:
    build:
      context: ./server
    image: mubashir15700/edutech-backend:latest
    container_name: edutech-backend
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_BACKEND_URL: http://localhost:3000/api
    image: mubashir15700/edutech-frontend:latest
    container_name: edutech-frontend
    ports:
      - "5173:80"
    env_file:
      - ./client/.env
    depends_on:
      - backend
    restart: unless-stopped

networks:
  edutech-network:
    driver: bridge
